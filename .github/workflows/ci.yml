name: CI

# Two things this repository could not verify on its own before:
#
#   1. PostgreSQL. The suites skip and EXIT 0 without a live server, so a run
#      with no database looked exactly like a passing run — while DEPLOYMENT.md
#      claimed "PostgreSQL (verified)". Here a real postgres:16 is attached and
#      OMEM_DATABASE_URL is set, so the claim is either true on every push or
#      the build goes red.
#
#   2. The dashboard build. `next build` needs more memory than some dev
#      machines have, so "it typechecks" was as far as local verification went.
#      Typecheck, lint and a real production build all run here.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  integrations-embeds:
    name: integrations / n8n node + openclaw skill
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      # Build the n8n community node so its e2e test runs instead of skipping.
      # --ignore-scripts: the devDeps are pure JS; nothing needs a build hook.
      - name: Build the n8n node
        working-directory: sdk/n8n-nodes-omem
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npx tsc
          node -e "require('fs').copyFileSync('nodes/Omem/omem.svg','dist/nodes/Omem/omem.svg')"
      - name: n8n node, driven through a mock n8n context against a live server
        working-directory: server
        run: |
          out=$(python tests_n8n_node.py)
          echo "$out"
          echo "$out" | grep -q "^SKIP" && { echo "::error::n8n test skipped in CI, the build step above should prevent this"; exit 1; }
          true
      - name: OpenClaw skill, the actual script as a subprocess against a live server
        working-directory: server
        run: python tests_openclaw_skill.py

  server-sqlite:
    name: server / sqlite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      # hypothesis drives the property-based conformance fuzzing; without it
      # that suite skips loudly rather than failing.
      - run: pip install hypothesis
      - name: Run every suite
        working-directory: server
        run: python run_tests.py

      - name: The no-dependencies claim must still be true
        # CONTRIBUTING.md rule 3 and half the reason this is easy to deploy in a
        # restricted environment. --check exits non-zero the moment a runtime
        # dependency appears, so the claim cannot quietly stop being true and
        # then get repeated in a README.
        run: python scripts/gen_sbom.py --check

      - name: The refusals in the demo must still happen
        # scripts/demo_refusal.py is shown to people deciding whether to rely on
        # this. It asserts every refusal it demonstrates and exits non-zero if
        # one stops happening, so it runs here: a demo that can quietly become
        # untrue is worse than no demo.
        env: { NO_COLOR: "1" }
        run: python scripts/demo_refusal.py

      - name: The reasoning in the demo must still hold
        # Same contract for the reasoning demo: identity merges, rule
        # conclusions, the same-request take-back, and split finality are all
        # asserted through the Python SDK against a real server.
        env: { NO_COLOR: "1" }
        run: python scripts/demo_reasoning.py

  server-postgres:
    name: server / postgres
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: omem
          POSTGRES_PASSWORD: omem-dev
          POSTGRES_DB: omem
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - run: pip install psycopg2-binary hypothesis
      # Restore verification restores a dump into a scratch database, which
      # needs CREATEDB (DEPLOYMENT.md says so; this is that line, executed).
      - name: Grant CREATEDB
        run: PGPASSWORD=omem-dev psql -h localhost -U omem -d omem -c 'ALTER USER omem CREATEDB;'
      - name: Run every suite against PostgreSQL
        working-directory: server
        env:
          OMEM_DATABASE_URL: postgres://omem:omem-dev@localhost:5432/omem
        run: python run_tests.py
      - name: Fail if the PG suites only skipped
        working-directory: server
        env:
          OMEM_DATABASE_URL: postgres://omem:omem-dev@localhost:5432/omem
        # A skip here would mean this job proved nothing, which is exactly the
        # failure mode it exists to catch.
        #
        # Anchored to the start of a line, because tests_pg_live.py legitimately
        # prints "SKIP LOCKED" - the name of the PostgreSQL feature it tests for
        # double-claims. A bare case-insensitive grep for SKIP matched that and
        # failed the job on a suite that had just passed 32 of 32. It went
        # unnoticed only because the job used to die at the previous step.
        run: |
          out=$(python tests_pg_live.py)
          echo "$out"
          if echo "$out" | grep -qE '^[[:space:]]*SKIP:'; then
            echo "::error::PG suite skipped in the PG job"; exit 1
          fi
          # A skip is not the only way to prove nothing: assert it reported a
          # pass count, so a crash before the summary cannot read as success.
          if ! echo "$out" | grep -qE '^[0-9]+ passed, [0-9]+ failed'; then
            echo "::error::PG suite printed no pass/fail summary"; exit 1
          fi
          exit 0

  encrypted-at-rest:
    name: server / encryption on
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      # cryptography, because content encryption REFUSES to run without real
      # AEAD rather than falling back to the stdlib HMAC keystream.
      - run: pip install hypothesis cryptography
      # The whole suite with content encryption enabled. Encrypting a column
      # means every read of it has to decrypt, and the failure mode for a missed
      # read site is json.loads choking on a "v1g." token — or worse, one of the
      # two scanner sites that swallow exceptions skipping the row in silence.
      # Running the existing 1300+ checks against ciphertext is what catches
      # that, so a future column read added without a decrypt fails here.
      - name: Run every suite against encrypted storage
        working-directory: server
        env:
          OMEM_ENCRYPT_AT_REST: "1"
          OMEM_MASTER_KEY: ci-encryption-key-not-the-development-default
        run: python run_tests.py

  auth-modes:
    name: server / auth modes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - run: pip install cryptography
      - name: Password mode
        working-directory: server
        run: python tests_auth_password.py
      - name: Local mode refuses a public bind
        working-directory: server
        # The guard is the whole reason local mode is safe; assert it rather
        # than trusting the comment above it.
        run: |
          if OMEM_HOST=0.0.0.0 OMEM_DB=data/ci_bind.db python -c "import api; api.enforce_auth_safety('0.0.0.0')"; then
            echo "::error::local mode accepted a non-loopback bind"; exit 1
          fi
          echo "refused, as it should"
      - name: TLS, audit chain, encryption and the writer lock
        working-directory: server
        # An indented heredoc would reach python with its leading spaces intact
        # and die on IndentationError; the suite covers all of this properly
        # anyway, including that a second writer is refused.
        run: python tests_hardening_p11.py

      - name: Password mode refuses the default master key
        working-directory: server
        run: |
          if OMEM_AUTH=password OMEM_DB=data/ci_key.db python -c "import api; api.enforce_auth_safety('127.0.0.1')"; then
            echo "::error::password mode accepted the development master key"; exit 1
          fi
          echo "refused, as it should"

  package:
    name: wheel / pip install and quickstart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.9" }        # the floor we advertise
      - uses: actions/setup-node@v7
        with: { node-version: "20", cache: npm, cache-dependency-path: web/package-lock.json }
      # The dashboard is built here and copied into the wheel by hatch_build.py,
      # which is what makes `pip install` enough to get a UI. This is also the
      # only machine that can build it — Next needs more memory than some dev
      # machines have — so the wheel must be built here too, never locally.
      - name: Build the dashboard (static export)
        working-directory: web
        env: { OMEM_STATIC: "1", NEXT_PUBLIC_OMEM_BUNDLED: "1" }
        run: |
          npm ci
          npm run build
          test -f out/index.html || { echo "::error::static export produced no index.html"; exit 1; }
          echo "exported $(find out -type f | wc -l) files"
      # llms.txt promises the full text of every page and llms-full.txt was
      # written by hand, so it drifted to half the site without anything
      # noticing. This is the only job with an export to read, and it refuses a
      # page that rendered nothing, so a public route that has lost its shell
      # fails here too.
      - name: llms-full.txt must still be the whole site
        run: python scripts/gen_llms_full.py --from-dir web/out --check
      # This job owns the only static export that exists anywhere, and the
      # machine this project is written on cannot run `next build` (3.8 GB of
      # RAM, and Next needs more). So when the check above goes red, the person
      # who changed a page has no way to produce the corrected file. Uploading
      # it here turns "regenerate it locally" into "download the artifact and
      # commit it", which is the difference between a guard that helps and a
      # guard that blocks. Runs on failure too, which is the case that matters.
      - name: Upload the llms-full.txt this export would produce
        if: always()
        run: python scripts/gen_llms_full.py --from-dir web/out --out /tmp/llms-full.txt || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: llms-full
          path: /tmp/llms-full.txt
          if-no-files-found: warn
      - run: pip install build
      - name: Build the wheel
        working-directory: sdk/python
        run: python -m build --wheel
      - name: The wheel must actually contain the dashboard
        # One line, not a heredoc: an indented heredoc body reaches python with
        # its leading spaces intact and dies on IndentationError.
        run: >-
          python -c "import glob,zipfile,sys;
          n=zipfile.ZipFile(glob.glob('sdk/python/dist/*.whl')[0]).namelist();
          d=[x for x in n if '/_dashboard/' in x];
          print(len(d),'dashboard files in the wheel');
          sys.exit(0 if any(x.endswith('_dashboard/index.html') for x in d) else 1)"

      - name: Install it clean
        run: pip install sdk/python/dist/*.whl
      - name: The state must be reproducible from the log
        # Not a unit test: this runs the shipped console command against the
        # database the quickstart just created, which is the only way to know
        # the wrapper resolves _server/ and finds OMEM_DB the same way
        # omem-server writes it.
        run: |
          cd "$(mktemp -d)"
          OMEM_DB=/tmp/verify-ci.db timeout 60 omem-server 8790 >/dev/null 2>&1 &
          for i in $(seq 1 40); do curl -sf http://127.0.0.1:8790/v1/health >/dev/null && break; sleep 1; done
          curl -sf -X POST http://127.0.0.1:8790/v1/signup -H 'Content-Type: application/json'                -d '{"email":"ci@x.com"}' >/dev/null
          sleep 1; pkill -f "omem-server 8790" || true; sleep 1
          OMEM_DB=/tmp/verify-ci.db omem-verify
          OMEM_DB=/tmp/verify-ci.db omem-verify --record
          OMEM_DB=/tmp/verify-ci.db omem-verify --anchor .omem-state.json

      - name: Run QUICKSTART.md, exactly as written
        # A script rather than an inline heredoc: an indented heredoc body
        # reaches python with its leading spaces intact and dies on
        # IndentationError. It is also runnable locally, which a YAML block
        # is not.
        run: python scripts/verify_quickstart.py --port 8787
      - name: The dashboard is served by the API server
        # The whole point of bundling: one install, one command, one URL.
        run: |
          omem-server 8788 > dash.log 2>&1 &
          for i in $(seq 1 40); do curl -sf http://127.0.0.1:8788/v1/health >/dev/null && break; sleep 1; done
          cat dash.log
          code=$(curl -s -o page.html -w "%{http_code}" http://127.0.0.1:8788/)
          test "$code" = "200" || { echo "::error::GET / returned $code, not the dashboard"; exit 1; }
          grep -qi "<html" page.html || { echo "::error::GET / did not return HTML"; exit 1; }
          curl -sf http://127.0.0.1:8788/v1/health >/dev/null || { echo "::error::static serving broke the API"; exit 1; }
          echo "dashboard served, API intact"

  sdk-typescript:
    name: sdk / typescript
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: sdk/typescript }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: "20", cache: npm, cache-dependency-path: sdk/typescript/package-lock.json }
      # test_parity.mjs starts the REAL server and drives the built SDK against
      # it, so this job needs a Python as well as a Node.
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - run: npm ci
      # Typecheck and emit are separate steps so a type error and a build error
      # are distinguishable in the log.
      - run: npx tsc --noEmit
      - run: npm run build
      - name: The build must actually produce the entrypoint
        # package.json main points at dist/index.js. Until there was a build
        # step it pointed at src/index.ts, and test_parity.mjs imported a
        # dist/ that no command created - so the one contribution README calls
        # "the most useful available right now" died on ERR_MODULE_NOT_FOUND
        # for anyone who tried it. Assert the file exists rather than assume.
        run: test -f dist/index.js && test -f dist/index.d.ts
      - name: Parity against a live server
        run: node test_parity.mjs

  integrations:
    name: server / framework integrations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      # Without langgraph the adapter suite skips honestly and verifies
      # nothing, which is the failure mode this repository's test runner exists
      # to make visible. Installing it here is what turns the adapter from
      # "there is a file" into "it satisfies the interface LangGraph calls".
      - run: pip install langgraph
      - name: The LangGraph store adapter, against a real server
        working-directory: server
        run: python tests_langgraph_store.py
      - name: It must not have skipped
        working-directory: server
        run: |
          out=$(python tests_langgraph_store.py)
          if echo "$out" | grep -qE '^[[:space:]]*SKIP:'; then
            echo "::error::the adapter suite skipped in the job that installs langgraph"; exit 1
          fi
          echo "$out" | tail -1

  dashboard:
    name: dashboard / web
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: web }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: "20", cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx next lint
      - run: npm run build

  image:
    name: docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t omem:ci .
      # The container must actually come up: the bind guard plus a non-root
      # user are both new, and either could stop it dead.
      - name: Boot it
        run: |
          docker run -d --name omem-ci -p 127.0.0.1:8787:8787 omem:ci
          for i in $(seq 1 45); do
            if curl -sf http://127.0.0.1:8787/v1/health > /dev/null; then
              curl -s http://127.0.0.1:8787/v1/health; echo; docker rm -f omem-ci; exit 0
            fi
            sleep 2
          done
          echo "::error::server never became healthy"; docker logs omem-ci; exit 1
