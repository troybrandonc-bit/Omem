name: CLA

# One signature per contributor, recorded in a file in this repo rather than in
# a third-party service. Signatures are stored on a branch so they survive the
# bot, and so anyone can audit who agreed to what.
#
# See CLA.md for the text and for why this project asks for one at all.

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/cla.json
          path-to-document: https://github.com/troybrandonc-bit/Omem/blob/main/CLA.md
          branch: cla-signatures
          # troybrandonc-bit is the copyright holder. A CLA exists so that
          # contributions from OTHER people can be relicensed later; asking the
          # owner to license their own work to themselves is meaningless, and it
          # blocks every maintainer PR on a signature that grants nothing.
          allowlist: troybrandonc-bit,dependabot[bot],github-actions[bot]
          custom-notsigned-prcomment: |
            Thanks for the pull request. Before it can be merged, please sign the
            [Contributor License Agreement](CLA.md) by commenting exactly:

            > I have read the CLA Document and I hereby sign the CLA

            You sign once, not per pull request. **CLA.md explains why this
            project asks** — short version: the core stays MIT, you keep
            ownership of your work, and this keeps a commercial tier possible
            without having to track down every past contributor.

            If you would rather not sign, that is a legitimate position. Open an
            issue describing the change instead and it will be implemented with
            credit to you.
          custom-pr-sign-comment: "I have read the CLA Document and I hereby sign the CLA"
          custom-allsigned-prcomment: "All contributors have signed the CLA. Thanks."
