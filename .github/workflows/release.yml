name: Release

# Publishing used to be a person on a laptop. 0.2.0 reached PyPI by hand, there
# were no git tags, and the changelog still said "unreleased" for a version that
# had shipped — three symptoms of the same missing step.
#
# Now a tag is the release. Push `v0.2.1` and this builds the wheel with the
# dashboard baked in, checks the tag matches pyproject, and publishes.
#
# Auth is PyPI trusted publishing (OIDC), NOT an API token in secrets. A
# long-lived token that can overwrite a package everyone pip-installs is exactly
# the credential you do not want sitting in a repository setting. Configure it
# once at https://pypi.org/manage/project/omem-infrastructure/settings/publishing/
#   owner: troybrandonc-bit        repo: Omem
#   workflow: release.yml      environment: pypi

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and verify, but do not publish"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  # The tag says one thing and pyproject says another often enough that it is
  # worth failing here rather than shipping a wheel whose version is a lie.
  verify:
    name: verify the tag matches the package
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: check
        run: |
          PKG=$(grep -m1 '^version = ' sdk/python/pyproject.toml | cut -d'"' -f2)
          echo "version=$PKG" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${GITHUB_REF#refs/tags/v}"
            if [ "$TAG" != "$PKG" ]; then
              echo "::error::tag v$TAG does not match pyproject version $PKG"
              exit 1
            fi
            echo "tag v$TAG matches pyproject $PKG"
          fi
      # `omem.__version__` is public API and drifted to 0.1.2 while the package
      # shipped 0.2.1 — so anyone who checked the version they had installed got
      # a number from two releases earlier. Nothing read it, which is exactly why
      # nobody noticed. Now the tag, pyproject and the module all have to agree.
      - name: The SDK __version__ must match pyproject
        run: |
          V="${{ steps.check.outputs.version }}"
          MOD=$(grep -m1 '^__version__ = ' sdk/python/omem/__init__.py | cut -d'"' -f2)
          if [ "$MOD" != "$V" ]; then
            echo "::error::omem.__version__ is $MOD but pyproject says $V"; exit 1
          fi
          echo "omem.__version__ $MOD matches pyproject"

      # server.json pins the version TWICE, and the registry keeps serving the
      # last version it was told about. Ship 0.2.8 without re-publishing and the
      # registry still advertises 0.2.7 to every MCP client, silently and
      # indefinitely, because nothing anywhere fails.
      - name: server.json must agree with the package
        run: |
          V="${{ steps.check.outputs.version }}"
          S=$(jq -r '.version' server.json)
          P=$(jq -r '.packages[0].version' server.json)
          if [ "$S" != "$V" ] || [ "$P" != "$V" ]; then
            echo "::error::server.json has version=$S and package version=$P, but pyproject says $V"
            exit 1
          fi
          # Ownership verification reads the PACKAGED readme, the one that
          # becomes the PyPI description. pyproject points `readme` at
          # sdk/python/README.md, NOT the repository root readme, and getting
          # that wrong fails at publish time with nothing visible in the diff.
          N=$(jq -r '.name' server.json)
          if ! grep -qF "mcp-name: $N" sdk/python/README.md; then
            echo "::error::sdk/python/README.md has no 'mcp-name: $N' line, so the registry cannot verify ownership"
            exit 1
          fi
          echo "server.json agrees with pyproject at $V, and the ownership line is present"

      - name: The changelog must have an entry for this version
        run: |
          V="${{ steps.check.outputs.version }}"
          if ! grep -q "^## $V" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## $V' heading"; exit 1
          fi
          # "unreleased" survived into a published version once already.
          if grep -iE "^## $V.*unreleased" CHANGELOG.md; then
            echo "::error::CHANGELOG.md still marks $V as unreleased"; exit 1
          fi

  # A release that ships a broken wheel is worse than no release, so the full
  # suite runs again on the tagged commit rather than trusting the branch build.
  test:
    name: full suite on the tagged commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - run: pip install hypothesis cryptography
      - working-directory: server
        run: python run_tests.py

  build:
    name: build the wheel
    needs: [verify, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: "20", cache: npm, cache-dependency-path: web/package-lock.json }
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }

      # The dashboard is a static export copied into the wheel at build time, so
      # `pip install` is the whole install — no Node at runtime, no second port.
      # If this step is skipped the wheel still builds and the server just says
      # "dashboard not bundled", which is a quiet way to ship a worse product.
      - name: Build the bundled dashboard
        working-directory: web
        # NEXT_PUBLIC_OMEM_BUNDLED=1 makes the client call /v1/... at the same
        # origin the Python server serves from, instead of the dev-only
        # /api/omem rewrite. next.config.js now defaults this on for any static
        # export, but set it explicitly here too: a wheel whose dashboard cannot
        # reach its own server is the kind of break worth being loud about.
        run: npm ci && OMEM_STATIC=1 NEXT_PUBLIC_OMEM_BUNDLED=1 npm run build

      - name: Build sdist and wheel
        run: pipx run build --sdist --wheel --outdir dist/ sdk/python

      - name: The wheel must actually contain the dashboard
        run: |
          python -m zipfile -l dist/*.whl > files.txt
          if ! grep -q "_dashboard/index.html" files.txt; then
            echo "::error::wheel has no bundled dashboard"; exit 1
          fi
          grep -c "_dashboard/" files.txt | xargs echo "dashboard files in wheel:"

      - name: Metadata check
        run: pipx run twine check dist/*

      # Install the built wheel into a clean environment and start the server,
      # because "it built" and "it runs" have been different things before.
      - name: Smoke test the built wheel
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install --quiet dist/*.whl
          OMEM_DB=/tmp/smoke.db /tmp/smoke/bin/omem-server 8799 &
          for i in $(seq 1 40); do
            curl -sf http://127.0.0.1:8799/v1/health >/dev/null && break || sleep 0.5
          done
          curl -sf http://127.0.0.1:8799/v1/health | head -c 200
          curl -sfo /dev/null http://127.0.0.1:8799/ || { echo "::error::dashboard not served"; exit 1; }
          echo "wheel installs, server starts, dashboard serves"

      - uses: actions/upload-artifact@v7
        with: { name: dist, path: dist/ }

  publish:
    name: publish to PyPI
    needs: build
    if: github.event_name == 'push' || inputs.dry_run == false
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/omem-infrastructure
    permissions:
      id-token: write        # OIDC for trusted publishing
      contents: write        # to create the GitHub Release
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with: { name: dist, path: dist/ }

      - uses: pypa/gh-action-pypi-publish@release/v1
        # No `password:` on purpose — trusted publishing uses the OIDC token.

      - name: Cut the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          # Derived from the tag being built, NOT from needs.verify.outputs.
          # "Re-run failed jobs" does not re-execute the verify job, and its
          # outputs came through empty: `gh release create "v$V"` became
          # `gh release create "v"`, which tagged the repo `v` and titled the
          # release `v`. github.ref_name is the tag itself and is always
          # present, including on a partial re-run.
          REF: ${{ github.ref_name }}
        run: |
          V="${REF#v}"
          if [ -z "$V" ] || [ "$V" = "$REF" ]; then
            echo "::error::could not derive a version from ref '$REF' (expected vX.Y.Z)"
            exit 1
          fi
          # Pull this version's section out of the changelog for the release body.
          awk -v v="## $V" '
            $0 ~ "^" v {p=1; next}
            p && /^## / {exit}
            p {print}
          ' CHANGELOG.md > notes.md
          echo "" >> notes.md
          echo "Install: \`pip install omem-infrastructure==$V\`" >> notes.md
          # Idempotent: a re-run should not fail because the release exists.
          if gh release view "v$V" >/dev/null 2>&1; then
            gh release upload "v$V" dist/* --clobber
            gh release edit "v$V" --title "v$V" --notes-file notes.md
          else
            gh release create "v$V" dist/* --title "v$V" --notes-file notes.md
          fi

  # CI builds this image on every PR and then ships it nowhere, so `docker run`
  # was documented as "build it yourself". Publishing to GHCR makes it a
  # one-liner and one more surface where people find things. Deliberately NOT
  # `needs: publish`: an image publish must not be blocked by a PyPI hiccup,
  # and vice versa; both gate on the same verified, tested build.
  image:
    name: publish the image to GHCR
    needs: build
    if: github.event_name == 'push' || inputs.dry_run == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and push
        # Version from pyproject, not the ref: works identically for a tag
        # push and a manual dispatch from main, and verify has already proven
        # pyproject agrees with the tag when there is one.
        run: |
          V=$(grep -m1 '^version = ' sdk/python/pyproject.toml | cut -d'"' -f2)
          IMG=ghcr.io/troybrandonc-bit/omem
          docker build \
            --label org.opencontainers.image.source=https://github.com/troybrandonc-bit/Omem \
            --label org.opencontainers.image.description="Memory for AI agents that tracks what is believed, when, and why" \
            --label org.opencontainers.image.licenses=MIT \
            -t "$IMG:$V" -t "$IMG:latest" .
          docker push "$IMG:$V"
          docker push "$IMG:latest"

  # Must run after PyPI, not alongside it. The registry verifies ownership by
  # fetching the package description from PyPI and matching the mcp-name line,
  # so a registry publish that beats PyPI fails with "Package validation
  # failed" -- which reads like a broken server.json and is not one.
  registry:
    name: publish to the MCP Registry
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      id-token: write        # OIDC. No token in secrets, same reasoning as PyPI.
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Wait for the release to be visible on PyPI
        # PyPI's JSON API and its file index do not update together. Observed
        # roughly a minute apart on the 0.2.6 release: the JSON API served the
        # new version while `pip install` of it still 404'd.
        run: |
          V="${GITHUB_REF#refs/tags/v}"
          for i in $(seq 1 30); do
            if curl -sf "https://pypi.org/pypi/omem-infrastructure/$V/json" >/dev/null; then
              echo "omem-infrastructure $V is live on PyPI"
              exit 0
            fi
            sleep 10
          done
          echo "::error::$V never appeared on PyPI after 5 minutes"; exit 1

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Validate server.json
        run: ./mcp-publisher validate

      - name: Authenticate with OIDC
        run: ./mcp-publisher login github-oidc

      - name: Publish
        run: ./mcp-publisher publish
