[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "testimony-langgraph"
version = "0.1.0"
description = "Emit a Testimony Record from a LangGraph human-in-the-loop flow, so the record can say who approved."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Troy Clifford" }]
keywords = ["langgraph", "human-in-the-loop", "audit-trail", "accountability",
            "ai-agents", "approval", "eu-ai-act", "article-14", "provenance",
            "testimony-record", "agent-governance"]
# LangGraph and nothing else. This adapter deliberately does not depend on OMEM
# or on any hosted service: a format that needs one vendor's software to emit is
# a product, not a specification, and a test in the repository asserts the
# absence of that import.
dependencies = ["langgraph>=0.2"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Legal Industry",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: System :: Logging",
]

[project.urls]
Specification = "https://datatracker.ietf.org/doc/draft-clifford-testimony-record/"
Source = "https://github.com/troybrandonc-bit/Omem/tree/main/adapters/langgraph"
Assessment = "https://doi.org/10.5281/zenodo.22290922"
Issues = "https://github.com/troybrandonc-bit/Omem/issues"

[project.scripts]
# The validator ships with the adapter so a record can be checked by whoever is
# holding it, without cloning a repository. It is the reference implementation,
# one standard-library file, no network access.
testimony-validate = "testimony_validate:main"

# hatch_build.py copies ../../scripts/testimony_validate.py in at build time,
# for both targets, so there is exactly one validator in the world and this
# package carries a copy of it rather than a fork of it.
[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.wheel]
only-include = ["testimony_langgraph.py", "testimony_validate.py"]
sources = ["."]
# Generated by the hook, so gitignored and therefore invisible to hatchling's
# default file selection. Without this the console script installs broken.
artifacts = ["testimony_validate.py"]

[tool.hatch.build.targets.sdist]
include = ["testimony_langgraph.py", "example.py", "README.md", "LICENSE",
           "hatch_build.py", "pyproject.toml"]
artifacts = ["testimony_validate.py"]
