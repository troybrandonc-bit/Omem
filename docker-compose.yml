services:
  omem:
    build: .
    image: omem
    ports:
      - "3000:3000"   # dashboard
      - "8787:8787"   # API
    environment:
      OMEM_HOST: "0.0.0.0"
      OMEM_API_URL: "http://127.0.0.1:8787"
      OMEM_SEED_DEMO: "0"
    # persist memory across restarts (SQLite db lives here)
    volumes:
      - omem-data:/app/server/data
    restart: unless-stopped

volumes:
  omem-data:
