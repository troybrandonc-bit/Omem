[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "omem-infrastructure"
version = "0.3.9"
description = "Trustworthy memory for AI agents. The official OMEM Python SDK."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "OMEM" }]
keywords = ["ai", "agents", "memory", "llm", "mcp", "knowledge", "belief"]
# Zero third-party dependencies: the SDK is stdlib-only (urllib + json), so
# `pip install omem-infrastructure` is instant and cannot break on dependency conflicts.
dependencies = []
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://infrastructure.omem-cloud.com"
Documentation = "https://infrastructure.omem-cloud.com/docs"
Source = "https://github.com/troybrandonc-bit/Omem"
Changelog = "https://github.com/troybrandonc-bit/Omem/blob/main/CHANGELOG.md"
Issues = "https://github.com/troybrandonc-bit/Omem/issues"

[project.scripts]
# `omem-mcp` starts the MCP server over stdio, so any MCP client can launch it.
omem-mcp = "omem.mcp_server:main"
# `omem-verify` replays the op log and proves the state follows from it, and
# with --anchor compares against a digest recorded earlier and kept elsewhere.
# A reproducibility claim nobody can check is the weakest part of an
# accountability pitch, so it ships with the package rather than living in the
# repository where only contributors would find it.
omem-verify = "omem.verify_cli:main"
# `omem-server` starts the full OMEM server (engine + HTTP API), bundled in the
# package — so `pip install omem-infrastructure` then `omem-server` runs a server
# with no repo clone and no dependencies.
omem-server = "omem.server_cli:main"

[project.optional-dependencies]
# The SDK core needs nothing. This extra is only for contributors running tests.
# hypothesis drives the property-based fuzzing in tests_p10_1_conformance.py,
# which skips loudly without it rather than failing the run: an install of this
# package must never need a third-party dependency.
dev = ["pytest>=7", "hypothesis>=6"]
# PostgreSQL is a supported backend (server/db_adapter.py) and needs a driver.
# Nothing declared one, so `OMEM_DATABASE_URL=postgres://...` died on
# ModuleNotFoundError for everyone who followed DEPLOYMENT.md. It stays an
# EXTRA, not a dependency, because the SQLite default must keep installing with
# no compiler and no wheels: `pip install "omem-infrastructure[postgres]"`.
postgres = ["psycopg2-binary>=2.9"]
# omem.integrations.langgraph_store makes OMEM a LangGraph BaseStore, so a
# LangChain agent gets memory where a put supersedes instead of overwriting.
# An EXTRA because the adapter is opt-in and importing it is the only thing
# that needs langgraph: `pip install "omem-infrastructure[langgraph]"`.
langgraph = ["langgraph>=0.2"]
# OMEM_ENCRYPT_AT_REST needs real AEAD. The stdlib fallback used for OAuth
# tokens is a hand-rolled HMAC-SHA256 keystream, which is not what an entire
# memory store should be encrypted with, so content encryption refuses to run
# without this rather than quietly using it.
encryption = ["cryptography>=42"]

# hatch_build.py copies ../../server into omem/_server at build time, for both
# targets. Without it `omem-server` installs broken, and a committed copy would
# be 26,000 lines of drift waiting to happen.
[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.wheel]
packages = ["omem"]
# _server is generated by the hook, so it is gitignored and therefore invisible
# to hatchling's default file selection. artifacts includes it anyway, and this
# is what makes the bundled server actually reach the wheel.
artifacts = ["omem/_server/**/*", "omem/_dashboard/**/*"]

[tool.hatch.build.targets.sdist]
include = ["omem", "README.md", "hatch_build.py"]
# The sdist must carry the bundled server as well: a wheel built FROM an sdist
# has no ../../server to copy from, so omitting it here would produce exactly
# the broken `omem-server` this arrangement exists to prevent.
artifacts = ["omem/_server/**/*", "omem/_dashboard/**/*"]
