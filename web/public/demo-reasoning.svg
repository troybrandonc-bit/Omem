<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" width="720" height="480" role="img" aria-label="Terminal replay of scripts/demo_reasoning.py: identity resolution merges one person's two records, a declared rule concludes, the premise is retracted and the conclusion is withdrawn in the same request, and a split is final for the machine.">
  <!-- A replay of the real output of scripts/demo_reasoning.py, abridged.
       Every line below appears verbatim in the demo, which is an asserted
       test run in CI, so this picture cannot quietly drift from the truth
       without a red build pointing at it. -->
  <style>
    .card { fill: #0d1117; stroke: #30363d; }
    .bar  { fill: #161b22; }
    .dot  { fill: #30363d; }
    text  { font-family: ui-monospace, 'JetBrains Mono', 'SFMono-Regular', Consolas, Menlo, monospace; font-size: 12.5px; fill: #c9d1d9; white-space: pre; }
    .t    { fill: #8b949e; font-size: 11.5px; }
    .head { fill: #e6edf3; font-weight: 600; }
    .dim  { fill: #8b949e; }
    .acc  { fill: #58a6ff; }
    .ok   { fill: #3fb950; }
    .warn { fill: #d29922; }
  </style>

  <rect class="card" x="0.5" y="0.5" width="719" height="479" rx="10"/>
  <rect class="bar" x="1" y="1" width="718" height="35" rx="9"/>
  <rect class="bar" x="1" y="20" width="718" height="16"/>
  <circle class="dot" cx="20" cy="18" r="5"/>
  <circle class="dot" cx="38" cy="18" r="5"/>
  <circle class="dot" cx="56" cy="18" r="5"/>
  <text class="t" x="76" y="22.5">omem ~ scripts/demo_reasoning.py</text>

  <text class="line" opacity="0" x="24" y="68"><animate attributeName="opacity" to="1" begin="0.4s" dur="0.15s" fill="freeze"/><tspan class="acc">$</tspan> python3 scripts/demo_reasoning.py</text>
  <text class="line head" opacity="0" x="24" y="92"><animate attributeName="opacity" to="1" begin="1.1s" dur="0.15s" fill="freeze"/>OMEM: reasoning with receipts</text>

  <text class="line head" opacity="0" x="24" y="126"><animate attributeName="opacity" to="1" begin="2.2s" dur="0.15s" fill="freeze"/>1. One person arrived twice. OMEM notices, and knows when not to.</text>
  <text class="line" opacity="0" x="24" y="148"><animate attributeName="opacity" to="1" begin="3.0s" dur="0.15s" fill="freeze"/>   before: the alias knows nothing        -&gt; <tspan class="warn">UNKNOWN</tspan></text>
  <text class="line" opacity="0" x="24" y="170"><animate attributeName="opacity" to="1" begin="3.8s" dur="0.15s" fill="freeze"/>   after one resolution pass              -&gt; <tspan class="ok">BELIEVED_TRUE</tspan></text>
  <text class="line dim" opacity="0" x="24" y="192"><animate attributeName="opacity" to="1" begin="4.6s" dur="0.15s" fill="freeze"/>   Sarah Chen at globex was refused: a shared name is not a shared identity</text>
  <text class="line dim" opacity="0" x="24" y="214"><animate attributeName="opacity" to="1" begin="5.3s" dur="0.15s" fill="freeze"/>   Dana against Dana Kim was only PROPOSED, because a given name is a guess</text>

  <text class="line head" opacity="0" x="24" y="248"><animate attributeName="opacity" to="1" begin="6.6s" dur="0.15s" fill="freeze"/>2. A declared rule concludes. Only what was declared, with its premises.</text>
  <text class="line" opacity="0" x="24" y="270"><animate attributeName="opacity" to="1" begin="7.4s" dur="0.15s" fill="freeze"/>   derived: <tspan class="acc">rel_involves_marco</tspan></text>
  <text class="line dim" opacity="0" x="24" y="292"><animate attributeName="opacity" to="1" begin="8.2s" dur="0.15s" fill="freeze"/>   /why walks from the conclusion to BOTH premises it used</text>

  <text class="line head" opacity="0" x="24" y="326"><animate attributeName="opacity" to="1" begin="9.5s" dur="0.15s" fill="freeze"/>3. The take-back. Retract the premise; the conclusion falls with it.</text>
  <text class="line" opacity="0" x="24" y="348"><animate attributeName="opacity" to="1" begin="10.3s" dur="0.15s" fill="freeze"/>   rel_involves_marco after the retraction -&gt; <tspan class="warn">UNKNOWN</tspan></text>
  <text class="line" opacity="0" x="24" y="370"><animate attributeName="opacity" to="1" begin="11.1s" dur="0.15s" fill="freeze"/>   the conclusion was withdrawn IN THE SAME REQUEST, no pass needed</text>

  <text class="line head" opacity="0" x="24" y="404"><animate attributeName="opacity" to="1" begin="12.4s" dur="0.15s" fill="freeze"/>4. A split is final for the machine.</text>
  <text class="line dim" opacity="0" x="24" y="426"><animate attributeName="opacity" to="1" begin="13.2s" dur="0.15s" fill="freeze"/>   and the next pass refuses to re-merge them</text>

  <text class="line ok" opacity="0" x="24" y="458"><animate attributeName="opacity" to="1" begin="14.5s" dur="0.15s" fill="freeze"/>all behaviours asserted and held</text>
  <text class="acc" opacity="0" x="276" y="458"><animate attributeName="opacity" to="1" begin="15.2s" dur="0.15s" fill="freeze"/><animate attributeName="opacity" values="1;0.15;1" begin="16.4s" dur="1.1s" repeatCount="indefinite"/>▍</text>
</svg>
